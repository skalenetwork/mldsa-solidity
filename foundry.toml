[profile.default]
# Pinned so a tag always rebuilds byte-identical bytecode. Bump deliberately.
solc_version = "0.8.37"
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./test/mldsa" },
    { access = "read", path = "./test/mldsa-key-registry" },
]
